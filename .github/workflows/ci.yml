name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: dortech_test, POSTGRES_USER: dortech, POSTGRES_PASSWORD: dortech }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dortech" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://dortech:dortech@localhost:5432/dortech_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv python install 3.12
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run ruff check . && uv run ruff format --check .
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend
      - run: uv run pip-audit --strict || true
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env: { NEXT_PUBLIC_SITE_URL: https://example.com, INTERNAL_API_URL: http://localhost:8000 }
      - run: npm audit --omit=dev --audit-level=high || true
        working-directory: frontend
