[project]
name = "dortech-backend"
version = "0.1.0"
description = "API и панель администратора сайта ООО «ДОРТЕХ»"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pillow>=13.0.0",
    "puremagic>=2.2.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.1",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.6",
    "starlette-admin[i18n]>=1.0.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "UP042", "UP046"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "faker>=40.43.0",
    "pip-audit>=2.10.1",
    "pip-licenses>=5.5.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
"app/admin/views.py" = ["E501"]
"alembic/*" = ["E501", "I"]
"app/services/files.py" = ["ASYNC240"]
"scripts/import_catalog.py" = ["ASYNC240"]
"tests/*" = ["E501", "ASYNC221"]
